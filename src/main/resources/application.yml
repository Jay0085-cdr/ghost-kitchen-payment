spring:
  application:
    name: ghost-kitchen-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ghost_kitchen}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  # PORT is set by hosting platforms like Render; SERVER_PORT is the previous local-only override; 8080 is the default.
  port: ${PORT:${SERVER_PORT:8080}}

ghost-kitchen:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    # Comma-separated allowed frontend origins. In production, set ALLOWED_ORIGINS to the
    # deployed frontend's real URL(s) — the localhost default only works for local dev.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*}
